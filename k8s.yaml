apiVersion: apps/v1
kind: Deployment
metadata:
  name: jay-6
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jay-6
  template:
    metadata:
      labels:
        app: jay-6
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jay-6
          image: ghcr.io/hellothisisflo/jay-6:latest
          imagePullPolicy: Always
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: jay-6
spec:
  type: ClusterIP
  selector:
    app: jay-6
  ports:
    - name: http
      port: 80
      targetPort: http
